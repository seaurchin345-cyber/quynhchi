<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gửi Quỳnh Chi 💖 Trái Tim Đập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-pink: #ff4d6d;
      --deep-pink: #c9184a;
      --soft-pink: #ff758f;
      --glow-pink: #ff85a1;
      --dark-bg: #0d0714;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: radial-gradient(circle at center, #240046 0%, #10002b 50%, var(--dark-bg) 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
    }

    /* Background Floating Hearts Canvas */
    #heartCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Container */
    .content-wrap {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      max-width: 650px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Nav Button */
    .top-actions {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-btn {
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .nav-btn:hover {
      background: rgba(255, 77, 109, 0.4);
      border-color: var(--primary-pink);
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
    }

    /* Title */
    .title-tag {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffb3c1;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(255, 179, 193, 0.6);
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(38px, 8vw, 56px);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 77, 109, 0.8), 0 0 40px rgba(255, 77, 109, 0.4);
      margin-bottom: 8px;
    }
    h1 span {
      background: linear-gradient(135deg, #ff758f, #ff4d6d, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      font-weight: 700;
      color: #e2e8f0;
      opacity: 0.9;
      margin-bottom: 24px;
    }

    /* Central Giant Beating Heart Container */
    .heart-stage {
      position: relative;
      width: 220px;
      height: 220px;
      display: grid;
      place-items: center;
      margin: 10px 0 24px;
      cursor: pointer;
    }

    /* Pulse Rings radiating from heart */
    .pulse-ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px solid rgba(255, 77, 109, 0.4);
      animation: pulseOut 2.2s ease-out infinite;
      pointer-events: none;
    }
    .pulse-ring:nth-child(2) {
      animation-delay: 0.7s;
    }
    .pulse-ring:nth-child(3) {
      animation-delay: 1.4s;
    }

    @keyframes pulseOut {
      0% {
        transform: scale(0.8);
        opacity: 0.9;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    /* The Main Heart SVG */
    .beating-heart {
      width: 150px;
      height: 150px;
      fill: url(#heartGradient);
      filter: drop-shadow(0 0 25px rgba(255, 77, 109, 0.9))
              drop-shadow(0 0 50px rgba(201, 24, 74, 0.7));
      animation: heartbeat 1.25s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      transition: transform 0.1s ease;
    }

    .beating-heart:hover {
      filter: drop-shadow(0 0 35px rgba(255, 77, 109, 1))
              drop-shadow(0 0 70px rgba(255, 133, 161, 0.9));
    }

    /* True Anatomical/Classic Heartbeat Rhythm: thump-thump ... thump-thump */
    @keyframes heartbeat {
      0% {
        transform: scale(1);
      }
      14% {
        transform: scale(1.22);
      }
      28% {
        transform: scale(1.05);
      }
      42% {
        transform: scale(1.28);
      }
      70% {
        transform: scale(1);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Fast heartbeat class when clicked */
    .beating-heart.fast {
      animation-duration: 0.6s !important;
    }

    /* Heart rate indicator */
    .bpm-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 800;
      color: #ffb3c1;
      margin-bottom: 20px;
    }
    .bpm-badge b {
      color: #ff4d6d;
      font-size: 15px;
    }

    /* Sweet Message Card */
    .message-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 20px 24px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      position: relative;
    }

    .message-text {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.6;
      color: #fff0f3;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease;
    }

    /* Interactive Buttons */
    .actions-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .action-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .action-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.6);
    }
    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: none;
    }
    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Floating mini burst hearts */
    .burst-heart {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      animation: burstFloat 1.8s ease-out forwards;
    }

    @keyframes burstFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.6) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.6) rotate(var(--rot));
      }
    }

    /* Bottom footer */
    footer {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <!-- Background Particle Canvas -->
  <canvas id="heartCanvas"></canvas>

  <!-- Top Action Navigation -->
  <div class="top-actions">
    <a href="index.html" class="nav-btn">
      <span>🏠</span> Menu Trang Chủ
    </a>
    <button class="nav-btn" id="musicToggleBtn">
      <span id="musicIcon">🎵</span> Giai Điệu: Bật
    </button>
  </div>

  <div class="content-wrap">
    <div class="title-tag">✨ SPECIAL SWEET SPACE ✨</div>
    <h1>Dành Tặng <span>Quỳnh Chi</span> 💖</h1>
    <p class="subtitle">Chạm vào trái tim để cảm nhận từng nhịp đập yêu thương!</p>

    <!-- Central Heart Stage -->
    <div class="heart-stage" id="heartStage" title="Bấm vào tớ đi nào!">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>

      <svg class="beating-heart" id="beatingHeart" viewBox="0 0 32 32">
        <defs>
          <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff758f" />
            <stop offset="50%" stop-color="#ff4d6d" />
            <stop offset="100%" stop-color="#800f2f" />
          </linearGradient>
        </defs>
        <path d="M16 28.5C15.5 28.5 3 20.3 3 11.5C3 6.8 6.8 3 11.5 3C13.8 3 15.1 4.2 16 5.3C16.9 4.2 18.2 3 20.5 3C25.2 3 29 6.8 29 11.5C29 20.3 16.5 28.5 16 28.5Z" />
      </svg>
    </div>

    <!-- Heart rate display -->
    <div class="bpm-badge">
      <span>Nhịp tim:</span>
      <b id="bpmCount">75</b>
      <span>BPM ❤️</span>
    </div>

    <!-- Message Card -->
    <div class="message-card">
      <div class="message-text" id="quoteText">
        "Chúc Quỳnh Chi luôn vui tươi, rạng rỡ và ngập tràn niềm vui mỗi ngày! 🌸"
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions-grid">
      <button class="action-btn" id="burstBtn">
        <span>💖</span> Bắn Tim Tung Tóe!
      </button>
      <button class="action-btn secondary" id="newQuoteBtn">
        <span>💌</span> Đổi Lời Chúc Mới
      </button>
    </div>

    <footer>
      Quỳnh Chi English Hub · Made with all my heart 💖
    </footer>
  </div>

  <script>
    /* ==========================================================================
       1. SWEET QUOTES FOR QUYNH CHI
       ========================================================================== */
    const sweetQuotes = [
      "Chúc Quỳnh Chi luôn xinh đẹp, mỉm cười thật tươi mỗi ngày nhé! 🌸",
      "Quỳnh Chi ơi, bạn là một người vô cùng đặc biệt và đáng yêu! ✨",
      "Mỗi nhịp tim đập là một lời chúc bình an và may mắn gửi tới Quỳnh Chi! 💖",
      "Học tập thật giỏi, tự tin tỏa sáng và đạt điểm 10 tuyệt đối nhé! 💯",
      "Dù ngày nắng hay ngày mưa, chúc Quỳnh Chi luôn luôn hạnh phúc! 🌈",
      "Nụ cười của Quỳnh Chi làm bừng sáng cả thế giới xung quanh đấy! 🥰",
      "Hôm nay bạn đã làm rất tốt rồi, hãy tự thưởng cho mình một nụ cười thật tươi nhé! 🍓",
      "Trái tim này đập theo từng nhịp vui tươi của Quỳnh Chi! 💓"
    ];

    let quoteIdx = 0;
    const quoteText = document.getElementById('quoteText');
    const newQuoteBtn = document.getElementById('newQuoteBtn');

    newQuoteBtn.addEventListener('click', () => {
      playChime();
      quoteText.style.opacity = '0';
      setTimeout(() => {
        quoteIdx = (quoteIdx + 1) % sweetQuotes.length;
        quoteText.textContent = `"${sweetQuotes[quoteIdx]}"`;
        quoteText.style.opacity = '1';
      }, 250);
      burstHeartsAtCenter(12);
    });

    /* ==========================================================================
       2. HEARTBEAT & INTERACTION LOGIC
       ========================================================================== */
    const heartStage = document.getElementById('heartStage');
    const beatingHeart = document.getElementById('beatingHeart');
    const bpmCount = document.getElementById('bpmCount');
    const burstBtn = document.getElementById('burstBtn');

    let currentBPM = 75;
    let fastTimer = null;

    function triggerFastHeartbeat() {
      playHeartbeatSound();
      currentBPM = Math.min(145, currentBPM + 12);
      bpmCount.textContent = currentBPM;

      beatingHeart.classList.add('fast');
      clearTimeout(fastTimer);
      fastTimer = setTimeout(() => {
        beatingHeart.classList.remove('fast');
        const slowDownInterval = setInterval(() => {
          if (currentBPM > 75) {
            currentBPM -= 5;
            bpmCount.textContent = currentBPM;
          } else {
            currentBPM = 75;
            bpmCount.textContent = 75;
            clearInterval(slowDownInterval);
          }
        }, 150);
      }, 1500);
    }

    heartStage.addEventListener('click', (e) => {
      triggerFastHeartbeat();
      burstHeartsAt(e.clientX, e.clientY, 15);
    });

    burstBtn.addEventListener('click', (e) => {
      triggerFastHeartbeat();
      const rect = burstBtn.getBoundingClientRect();
      burstHeartsAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 25);
    });

    function burstHeartsAtCenter(count = 15) {
      const rect = beatingHeart.getBoundingClientRect();
      burstHeartsAt(rect.left + rect.width / 2, rect.top + rect.height / 2, count);
    }

    function burstHeartsAt(x, y, count) {
      const heartSymbols = ['💖', '💕', '💓', '💗', '💘', '✨', '🌸', '💝'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'burst-heart';
        el.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.fontSize = `${Math.floor(Math.random() * 18 + 18)}px`;

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 160 + 50;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 40;
        const rot = (Math.random() - 0.5) * 60;

        el.style.setProperty('--tx', `${tx}px`);
        el.style.setProperty('--ty', `${ty}px`);
        el.style.setProperty('--rot', `${rot}deg`);

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1800);
      }
    }

    /* ==========================================================================
       3. BACKGROUND CANVAS FLOATING PARTICLES
       ========================================================================== */
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const particles = [];
    const particleCount = 45;

    class FloatingHeart {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * w;
        this.y = h + Math.random() * 50;
        this.size = Math.random() * 14 + 10;
        this.speedY = Math.random() * 1.2 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.hue = Math.random() * 30 + 330; // Pink-Red spectrum
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -30) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${this.opacity})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsla(${this.hue}, 100%, 65%, 0.5)`;
        
        // Draw Heart Shape using bezier curves
        ctx.beginPath();
        const s = this.size / 15;
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-5 * s, -10 * s, -15 * s, -5 * s, -15 * s, 5 * s);
        ctx.bezierCurveTo(-15 * s, 15 * s, 0, 20 * s, 0, 25 * s);
        ctx.bezierCurveTo(0, 20 * s, 15 * s, 15 * s, 15 * s, 5 * s);
        ctx.bezierCurveTo(15 * s, -5 * s, 5 * s, -10 * s, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      const p = new FloatingHeart();
      p.y = Math.random() * h;
      particles.push(p);
    }

    function animateParticles() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach((p) => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Mouse sparkle trail
    window.addEventListener('pointermove', (e) => {
      if (Math.random() > 0.65) {
        burstHeartsAt(e.clientX, e.clientY, 1);
      }
    });

    /* ==========================================================================
       4. SYNTHESIZED SOUND & HARMONIC CHORD (Web Audio API)
       ========================================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicActive = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Gentle heartbeat lub-dub sound
    function playHeartbeatSound() {
      if (!musicActive) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      // Lub
      playThump(now, 75, 0.25);
      // Dub
      playThump(now + 0.16, 65, 0.2);
    }

    function playThump(time, freq, vol) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time);
      osc.frequency.exponentialRampToValueAtTime(35, time + 0.12);

      gain.gain.setValueAtTime(vol, time);
      gain.gain.linearRampToValueAtTime(0.001, time + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + 0.16);
    }

    // Sparkle Chime sound
    function playChime() {
      if (!musicActive) return;
      initAudio();
      if (!audioCtx) return;

      const notes = [523.25, 659.25, 783.99, 1046.5]; // C Major arpeggio
      const now = audioCtx.currentTime;
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.12, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.4);
      });
    }

    // Background melodic loop synthesizer
    let melodyInterval = null;
    const melodyNotes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
    function startGentleMelody() {
      clearInterval(melodyInterval);
      melodyInterval = setInterval(() => {
        if (!musicActive) return;
        if (!audioCtx || audioCtx.state === 'suspended') return;
        const now = audioCtx.currentTime;
        const freq = melodyNotes[Math.floor(Math.random() * melodyNotes.length)];
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 1.2);
      }, 2400);
    }
    startGentleMelody();

    // Music Toggle Button
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const musicIcon = document.getElementById('musicIcon');
    musicToggleBtn.addEventListener('click', () => {
      initAudio();
      musicActive = !musicActive;
      musicIcon.textContent = musicActive ? '🎵' : '🔇';
      musicToggleBtn.innerHTML = `<span id="musicIcon">${musicActive ? '🎵' : '🔇'}</span> Giai Điệu: ${musicActive ? 'Bật' : 'Tắt'}`;
      if (musicActive) playChime();
    });
  </script>
</body>
</html>
